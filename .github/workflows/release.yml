# SPDX-License-Identifier: Apache-2.0
name: Release

# Turn a pushed `vX.Y.Z` tag into a GitHub release whose body is the matching
# CHANGELOG section. Uses the preinstalled `gh` CLI (GITHUB_TOKEN) instead of a
# third-party release action, so there is no extra action to pin/audit.
#
# Release checklist (see CONTRIBUTING.md):
#   1. move the [Unreleased] notes into `## [X.Y.Z] - YYYY-MM-DD`
#   2. git tag -a vX.Y.Z -m "minas-skill X.Y.Z"
#   3. git push --follow-tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract the CHANGELOG section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - "$TAG" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^##\s*\[{re.escape(version)}\].*?$", re.M)
          match = pattern.search(text)
          if not match:
              print(f"no CHANGELOG section for {version}", file=sys.stderr)
              raise SystemExit(1)
          rest = text[match.end():]
          nxt = re.search(r"^##\s*\[", rest, re.M)
          body = (rest[: nxt.start()] if nxt else rest).strip()
          if not body:
              print(f"CHANGELOG section for {version} is empty", file=sys.stderr)
              raise SystemExit(1)
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"{len(body)} chars extracted for {version}")
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "minas-skill ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag
